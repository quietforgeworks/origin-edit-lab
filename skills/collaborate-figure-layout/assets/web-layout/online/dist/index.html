<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>拖动图片编排</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>拖动图片编排</h1><span id="status" role="status" aria-live="polite">正在加载…</span></header>
<main id="viewport"><div id="sizer"><div id="canvas" tabindex="0" aria-label="拖动图片编排画布"></div></div></main>
<footer><span>拖动图片，拉边缘调整大小。松手自动同步，排好后告诉我。</span><button id="retry" hidden>重试同步</button><button id="backup" hidden>备份当前布局</button></footer>
<dialog id="conflict"><h2>发现另一份布局</h2><p id="conflictMessage"></p><div><button id="useOnline">使用在线版</button><button id="keepLocal">保留当前版并同步</button></div></dialog>
<script type="module" src="app.js"></script></body></html>
